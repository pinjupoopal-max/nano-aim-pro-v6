
name: Build NANO AIM PRO V6

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          mkdir -p game/p4a-recipes/pygame-ce
          cp aimbot.py game/main.py

          cat > game/buildozer.spec <<'EOF'
          [app]
          title = NANO AIM PRO V6
          package.name = nanoaimprov6
          package.domain = org.nanoaim
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = python3,pygame-ce
          orientation = landscape
          fullscreen = 1
          android.api = 34
          android.minapi = 21
          android.ndk_api = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.debug_artifact = apk
          p4a.bootstrap = sdl2
          p4a.local_recipes = ./p4a-recipes
          EOF

          cat > game/p4a-recipes/pygame-ce/__init__.py <<'EOF'
          from os.path import join
          from pythonforandroid.recipe import CompiledComponentsPythonRecipe
          from pythonforandroid.toolchain import current_directory

          class Pygame2Recipe(CompiledComponentsPythonRecipe):
              version = "2.5.0"
              url = "https://github.com/pygame-community/pygame-ce/archive/refs/tags/{version}.tar.gz"
              site_packages_name = "pygame-ce"
              name = "pygame-ce"
              depends = [
                  "sdl2",
                  "sdl2_image",
                  "sdl2_mixer",
                  "sdl2_ttf",
                  "setuptools",
                  "jpeg",
                  "png",
              ]
              call_hostpython_via_targetpython = False
              install_in_hostpython = False

              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)
                  with current_directory(self.get_build_dir(arch.arch)):
                      setup_template = open("buildconfig/Setup.Android.SDL2.in").read()
                      env = self.get_recipe_env(arch)
                      env["ANDROID_ROOT"] = join(self.ctx.ndk.sysroot, "usr")

                      png = self.get_recipe("png", self.ctx)
                      png_lib_dir = join(png.get_build_dir(arch.arch), ".libs")
                      png_inc_dir = png.get_build_dir(arch)

                      jpeg = self.get_recipe("jpeg", self.ctx)
                      jpeg_inc_dir = jpeg_lib_dir = jpeg.get_build_dir(arch.arch)

                      sdl_mixer_includes = ""
                      mixer = self.get_recipe("sdl2_mixer", self.ctx)
                      for include_dir in mixer.get_include_dirs(arch):
                          sdl_mixer_includes += f"-I{include_dir} "

                      setup_file = setup_template.format(
                          sdl_includes=(
                              " -I" + join(self.ctx.bootstrap.build_dir, "jni", "SDL", "include")
                              + " -L" + join(self.ctx.bootstrap.build_dir, "libs", str(arch))
                              + " -L" + png_lib_dir
                              + " -L" + jpeg_lib_dir
                              + " -L" + arch.ndk_lib_dir_versioned
                          ),
                          sdl_ttf_includes="-I" + join(self.ctx.bootstrap.build_dir, "jni", "SDL2_ttf"),
                          sdl_image_includes="-I" + join(self.ctx.bootstrap.build_dir, "jni", "SDL2_image", "include"),
                          sdl_mixer_includes=sdl_mixer_includes,
                          jpeg_includes="-I" + jpeg_inc_dir,
                          png_includes="-I" + png_inc_dir,
                          freetype_includes="",
                      )
                      open("Setup", "w").write(setup_file)

              def get_recipe_env(self, arch):
                  env = super().get_recipe_env(arch)
                  env["USE_SDL2"] = "1"
                  env["PYGAME_CROSS_COMPILE"] = "TRUE"
                  env["PYGAME_ANDROID"] = "TRUE"
                  return env

          recipe = Pygame2Recipe()
          EOF

      - name: Build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/game:/home/user/hostcwd" \
            kivy/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NANO-AIM-PRO-V6
          path: game/bin/*.apk
          if-no-files-found: error
